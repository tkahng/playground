services:
  traefik:
    image: traefik:v3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:4000"
      - "--log.level=DEBUG"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--experimental.plugins.cloudflarewarp.modulename=github.com/BetterCorp/cloudflarewarp"
      - "--experimental.plugins.cloudflarewarp.version=v1.3.3"
    ports:
      - "4000:4000"
      - "8081:8080"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: tkahng/postgres:18
    container_name: database
    platform: linux/arm64
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DB}
    networks:
      - dokploy-network

  app:
    depends_on:
      - db
    image: playground:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - OTEL_SERVICE_NAME=playground
    networks:
      - dokploy-network
      - observability

networks:
  dokploy-network:
    driver: bridge
    name: dokploy-network
  observability:
    external: true
    name: observability

volumes:
  postgres-data:

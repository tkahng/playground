services:
  traefik:
    image: traefik:v3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--api.insecure=true"
      - "--entrypoints.web.address=:4000"
      - "--log.level=DEBUG"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--experimental.plugins.cloudflarewarp.modulename=github.com/BetterCorp/cloudflarewarp"
      - "--experimental.plugins.cloudflarewarp.version=v1.3.3"
    ports:
      - "4000:4000"
      - "8081:8080"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: tkahng/postgres:18
    container_name: database
    platform: linux/arm64
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_DB}
    networks:
      - dokploy-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${STORAGE_CLIENT_ID}
      - MINIO_ROOT_PASSWORD=${STORAGE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${STORAGE_CLIENT_ID} $${STORAGE_CLIENT_SECRET};
        mc mb --ignore-existing local/$${STORAGE_BUCKET_NAME};
        mc anonymous set download local/$${STORAGE_BUCKET_NAME};
      "
    environment:
      - STORAGE_CLIENT_ID=${STORAGE_CLIENT_ID}
      - STORAGE_CLIENT_SECRET=${STORAGE_CLIENT_SECRET}
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME}
    networks:
      - dokploy-network

  app:
    depends_on:
      - db
      - minio
    image: playground:latest
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - OTEL_SERVICE_NAME=playground
      - STORAGE_ENDPOINT_URL=http://minio:9000
    networks:
      - dokploy-network
      - observability

networks:
  dokploy-network:
    driver: bridge
    name: dokploy-network
  observability:
    external: true
    name: observability

volumes:
  postgres-data:
  minio-data:

version: "3.8"

services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    command:
      # Enable Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Entry point configuration
      - "--entrypoints.web.address=:4000"
      # API and dashboard (optional, for debugging)
      - "--api.insecure=true"
      - "--log.level=DEBUG"
    ports:
      - "4000:4000"
      - "8081:8080" # Traefik dashboard (optional)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Allow Traefik to reach host services
      - "host.docker.internal:host-gateway"
    labels:
      # API backend routing
      - "traefik.enable=true"
      - "traefik.http.routers.api-backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api-backend.entrypoints=web"
      - "traefik.http.routers.api-backend.priority=2"
      - "traefik.http.routers.api-backend.service=api-backend-service"
      - "traefik.http.services.api-backend-service.loadbalancer.server.url=http://host.docker.internal:8080"

      # React SPA routing (catch-all)
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.service=frontend-service"
      - "traefik.http.services.frontend-service.loadbalancer.server.url=http://host.docker.internal:5173"

networks:
  default:
    name: traefik-network
